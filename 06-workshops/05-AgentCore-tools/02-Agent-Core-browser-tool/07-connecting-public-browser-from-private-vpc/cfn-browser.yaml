AWSTemplateFormatVersion: "2010-09-09"
Description: "Complete AgentCore deployment with VPC isolation and browser automation capabilities"

# ============================================================================
# 템플릿 개요
# ============================================================================
# 이 CloudFormation 템플릿은 다음 주요 기능을 갖춘 완전한
# Amazon Bedrock AgentCore 환경을 배포합니다.
#
# 1. VPC 격리: AWS 서비스용 VPC 엔드포인트가 있는 안전한 프라이빗 네트워크
# 2. Browser 자동화: 웹 상호 작용 작업을 위한 AgentCore Browser 도구
# 3. 컨테이너 배포: 이미지 자동 빌드를 지원하는 ECR 리포지토리
# 4. 보안: 최소 권한 액세스 패턴을 적용한 IAM 역할
# 5. 모니터링: 로깅 및 관찰성을 위한 CloudWatch 통합
#
# 아키텍처 구성 요소:
# - AgentCore Runtime용 격리 서브넷이 있는 프라이빗 VPC
# - 안전한 AWS 서비스 통신을 위한 VPC 엔드포인트
# - 컨테이너 이미지 저장용 ECR 리포지토리
# - 컨테이너 이미지 자동 생성을 위한 CodeBuild
# - 테스트 및 개발용 EC2 인스턴스
# - Browser 도구가 통합된 AgentCore Runtime
# ============================================================================

# ============================================================================
# 파라미터 섹션
# ============================================================================
Parameters:

  # 컨테이너 구성
  ImageTag:
    Type: String
    Default: "latest"
    Description: "Docker image tag for the AgentCore container - use 'latest' for development"
    AllowedPattern: "^[a-zA-Z0-9._-]+$"

  # ECR 구성
  ECRRepositoryName:
    Type: String
    Default: "ecr"
    Description: "Name suffix for the ECR repository - will be prefixed with stack name"
    AllowedPattern: "^[a-z0-9-_]+$"
    ConstraintDescription: "Must be lowercase alphanumeric with hyphens and underscores only"

# ============================================================================
# 리소스 섹션 - 모듈별 구성
# ============================================================================

Resources:
  # ========================================================================
  # ECR 모듈 - 컨테이너 레지스트리
  # ========================================================================

  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W79
            reason: >-
              Sample ECR repository uses default encryption
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-${ECRRepositoryName}" 
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPullFromAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
      Tags:
        - Key: StackName
          Value: !Ref AWS::StackName

  # ========================================================================
  # IAM 모듈 - 보안 및 권한
  # ========================================================================

  # 에이전트 실행 역할 - AgentCore Runtime에서 에이전트 코드 실행에 사용
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AWS::Region}-agent-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeRolePolicy
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/BedrockAgentCoreFullAccess
      Policies:
        - PolicyName: AgentCoreExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt ECRRepository.Arn
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:DescribeLogGroups
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: XRayTracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Sid: CloudWatchMetrics
                Effect: Allow
                Resource: "*"
                Action: cloudwatch:PutMetricData
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-agent-execution-role"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: IAM

  # CodeBuild 서비스 역할 - 컨테이너 이미지 빌드 및 푸시에 사용
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AWS::Region}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !GetAtt ECRRepository.Arn
                  - "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-codebuild-role"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: IAM

  # Lambda 사용자 지정 리소스 역할 - CloudFormation 사용자 지정 리소스용 Lambda 함수에서 사용
  CustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AWS::Region}-custom-resource-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CustomResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:BatchGetProjects
                Resource: !GetAtt AgentImageBuildProject.Arn
              - Sid: BedrockAgentCoreMemoryAccess
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:GetMemory
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-custom-resource-role"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: IAM

  # ========================================================================
  # Lambda 모듈 - 사용자 지정 리소스
  # ========================================================================

  # CodeBuild 트리거 함수 - 스택 배포 중 CodeBuild 프로젝트 시작
  CodeBuildTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-codebuild-trigger"
      Description: "Triggers CodeBuild projects as CloudFormation custom resource"
      Handler: index.handler
      Role: !GetAtt CustomResourceRole.Arn
      Runtime: python3.13
      Timeout: 900
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import logging
          import time

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info('Received event: %s', json.dumps(event))
              
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  project_name = event['ResourceProperties']['ProjectName']
                  wait_for_completion = event['ResourceProperties'].get('WaitForCompletion', 'true').lower() == 'true'
                  
                  logger.info(f"Attempting to start CodeBuild project: {project_name}")
                  logger.info(f"Wait for completion: {wait_for_completion}")
                  
                  # CodeBuild 프로젝트 시작
                  codebuild = boto3.client('codebuild')
                  
                  # 먼저 프로젝트 존재 여부 확인
                  try:
                      project_info = codebuild.batch_get_projects(names=[project_name])
                      if not project_info['projects']:
                          raise Exception(f"CodeBuild project '{project_name}' not found")
                      logger.info(f"CodeBuild project '{project_name}' found")
                  except Exception as e:
                      logger.error(f"Error checking project existence: {str(e)}")
                      raise
                  
                  response = codebuild.start_build(projectName=project_name)
                  build_id = response['build']['id']
                  
                  logger.info(f"Successfully started build: {build_id}")
                  
                  if not wait_for_completion:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'BuildId': build_id,
                          'Status': 'STARTED'
                      })
                      return
                  
                  # 빌드 완료 대기
                  max_wait_time = context.get_remaining_time_in_millis() / 1000 - 30  # 30초 여유 시간 확보
                  start_time = time.time()
                  
                  while True:
                      if time.time() - start_time > max_wait_time:
                          error_message = f"Build {build_id} timed out"
                          logger.error(error_message)
                          cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': error_message})
                          return
                      
                      build_response = codebuild.batch_get_builds(ids=[build_id])
                      build_status = build_response['builds'][0]['buildStatus']
                      
                      if build_status == 'SUCCEEDED':
                          logger.info(f"Build {build_id} succeeded")
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              'BuildId': build_id,
                              'Status': build_status
                          })
                          return
                      elif build_status in ['FAILED', 'FAULT', 'STOPPED', 'TIMED_OUT']:
                          error_message = f"Build {build_id} failed with status: {build_status}"
                          logger.error(error_message)
                          
                          # 디버깅용 빌드 로그 가져오기
                          try:
                              logs_info = build_response['builds'][0].get('logs', {})
                              if logs_info.get('groupName') and logs_info.get('streamName'):
                                  logger.info(f"Build logs available in CloudWatch")
                          except Exception as log_error:
                              logger.warning(f"Could not get log information: {log_error}")
                          
                          cfnresponse.send(event, context, cfnresponse.FAILED, {
                              'Error': error_message,
                              'BuildId': build_id
                          })
                          return
                      
                      logger.info(f"Build {build_id} status: {build_status}")
                      time.sleep(30)  # 30초마다 확인
                  
              except Exception as e:
                  logger.error('Error: %s', str(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-codebuild-trigger"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: Lambda

  # ========================================================================
  # CodeBuild 모듈 - 컨테이너 이미지 빌드
  # ========================================================================
  AgentImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-agent-build"
      Description: !Sub "Build AgentCore container with browser automation for ${AWS::StackName}"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: IMAGE_REPO_NAME
            Value: !Ref ECRRepository
          - Name: IMAGE_TAG
            Value: !Ref ImageTag
          - Name: STACK_NAME
            Value: !Ref AWS::StackName
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
            build:
              commands:
                - echo Build started on `date`
                - echo Building the Docker image for default agent ARM64...

                # 1.1단계: requirements.txt 생성
                - |
                  cat > requirements.txt << 'EOF'
                  # strands-agents
                  # strands-agents-tools
                  # uv
                  boto3
                  bedrock-agentcore
                  # bedrock-agentcore-starter-toolkit
                  browser-use
                  # langchain-aws>=0.1.0
                  # rich
                  EOF

                # 1.2단계: my_agent.py 생성
                - |
                  cat > my_agent.py << 'EOF'


                  import shutil
                  import sys
                  from pathlib import Path
                  from bedrock_agentcore.runtime import BedrockAgentCoreApp
                  from bedrock_agentcore.tools.browser_client import BrowserClient
                  import asyncio, os
                  from boto3.session import Session


                  def find_browser_use_path():
                      """Automatically find the browser_use installation path"""
                      try:
                          import browser_use
                          browser_use_path = Path(browser_use.__file__).parent
                          session_file = browser_use_path / "browser" / "session.py"
                          return str(session_file)
                      except ImportError:
                          print("❌ browser_use not installed. Install with: pip install browser-use")
                          return None

                  def patch_browser_use():

                      # 파일 경로 자동 감지
                      file_path = find_browser_use_path()
                      if not file_path:
                          return False
                      
                      if not os.path.exists(file_path):
                          print(f"❌ File not found: {file_path}")
                          return False
                      
                      print(f"📁 Found browser_use at: {file_path}")
                      
                      # 백업 생성
                      backup_path = file_path + ".backup"
                      if not os.path.exists(backup_path):
                          shutil.copy2(file_path, backup_path)
                          print(f"💾 Created backup: {backup_path}")
                      else:
                          print(f"📋 Backup already exists: {backup_path}")
                      
                      # 파일 읽기
                      with open(file_path, 'r') as f:
                          content = f.read()
                      
                      # 변경 1: cdp_url 확인 다음에 headers 확인 추가
                      old1 = "if not cdp_url:\n\t\t\tprofile_kwargs['is_local'] = True"
                      new1 = "if not cdp_url:\n\t\t\tprofile_kwargs['is_local'] = True\n\n\t\tif headers:\n\t\t\tprofile_kwargs['headers'] = headers"
                      
                      if old1 in content and "if headers:\n\t\t\tprofile_kwargs['headers'] = headers" not in content:
                          content = content.replace(old1, new1)
                          print("✅ Added headers check")
                      elif "if headers:\n\t\t\tprofile_kwargs['headers'] = headers" in content:
                          print("✅ Headers check already exists")
                      else:
                          print("⚠️ Headers check pattern not found")
                      
                      # 변경 2: CDPClient에 headers 추가
                      old2 = "self._cdp_client_root = CDPClient(self.cdp_url)"
                      new2 = "self._cdp_client_root = CDPClient(self.cdp_url,  additional_headers=self.browser_profile.headers)"
                      
                      if old2 in content:
                          content = content.replace(old2, new2)
                          print("✅ Added headers to CDPClient")
                      elif "additional_headers=self.browser_profile.headers" in content:
                          print("✅ CDPClient headers already exists")
                      else:
                          print("⚠️ CDPClient pattern not found")
                      
                      # 파일에 다시 쓰기
                      with open(file_path, 'w') as f:
                          f.write(content)
                      
                      print("🎉 Patching complete!")
                      return True

                  patch_browser_use()

                  # 업데이트된 라이브러리 불러오기
                  from browser_use.llm import ChatAnthropicBedrock, ChatAWSBedrock
                  from browser_use import Agent
                  from browser_use import Browser, BrowserProfile



                  BROWSER_ID = os.getenv('BROWSER_ID', None)
                  AWS_REGION = os.getenv('AWS_REGION','us-west-2')
                  boto_session = Session(region_name=AWS_REGION)
                  region = boto_session.region_name
                  app = BedrockAgentCoreApp()

                  async def run_browser_task(browser_session: Browser, bedrock_chat: ChatAnthropicBedrock, task: str) -> None:
                      try:
                          # 에이전트 생성 및 실행
                          agent = Agent(
                              task=task,
                              llm=bedrock_chat,
                              browser_session=browser_session
                          )   
                          await agent.run()

                      except Exception as e:
                          raise

                  @app.async_task
                  async def async_main(query): 

                      # 지속형 Browser 세션 및 모델 생성
                      browser_session = None
                      bedrock_chat = None
                      client = BrowserClient(region)

                      try:
                          if BROWSER_ID:
                              client.start(identifier=BROWSER_ID)
                          else:
                              client.start()
                          print("Browser session started successfully!")

                          # ws_url 및 headers 추출
                          ws_url, headers = client.generate_ws_headers()
                          print(ws_url)
                          # print(headers)

                          # headers 및 제한 시간이 적용된 Browser 프로필 생성
                          browser_profile = BrowserProfile(
                              headers=headers,
                              timeout=1500000,  # 제한 시간 150초
                          )

                          # 지속성을 위해 CDP URL 및 keep_alive=True로 Browser 세션 생성
                          browser_session = Browser(
                              cdp_url=ws_url,
                              browser_profile=browser_profile,
                              keep_alive=True
                          )

                          # Browser 세션 초기화
                          await browser_session.start()

                          # ChatBedrockConverse를 한 번만 생성
                          bedrock_chat = ChatAnthropicBedrock(
                              model='global.anthropic.claude-haiku-4-5-20251001-v1:0',
                              aws_region=AWS_REGION
                          )

                          task = "Search for a coffee maker on amazon.com and extract details of the first one" ## 다른 작업을 실행하려면 task 수정

                          if query:
                              task = query

                          await run_browser_task(browser_session, bedrock_chat, task)

                      finally:
                          # Browser 세션 종료
                          client.stop()
                          print("✅ Browser session closed")


                  @app.entrypoint
                  async def invoke(payload=None):
                      try:
                          # 변경
                          query = payload.get("prompt")

                          asyncio.create_task(async_main(query))
                          
                          msg = (
                              "Processing started ... "
                              f"You can monitor status in CloudWatch logs at /aws/bedrock-agentcore/runtimes/<agent-runtime-id> ....."
                          )

                          return {
                              "status": "Started",
                              "message": msg
                          }
                          
                      except Exception as e:
                          return {"error": str(e)}


                  if __name__ == "__main__":
                      app.run()
                  EOF


                # 1.3단계: Dockerfile 생성
                - |
                  cat > Dockerfile << 'EOF'
                  FROM public.ecr.aws/docker/library/python:3.13-slim
                  WORKDIR /app

                  COPY requirements.txt requirements.txt
                  RUN pip install -r requirements.txt

                  # 루트가 아닌 사용자 생성
                  # RUN useradd -m -u 1000 bedrock_agentcore
                  # USER bedrock_agentcore
                  USER root

                  EXPOSE 8080
                  EXPOSE 8000

                  COPY . . 

                  CMD ["python", "-m", "my_agent"]

                  EOF

                # 1.5단계: 이미지 빌드
                - echo Building ARM64 image...
                - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
                - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
            
            post_build:
              commands:
                - echo Build completed on `date`
                - echo Pushing the Docker image...
                - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                - echo ARM64 Docker image pushed successfully
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-build"
        - Key: StackName
          Value: !Ref AWS::StackName

  # 사용자 지정 리소스 - 컨테이너 이미지 빌드 시작
  # 이 사용자 지정 리소스는 스택 배포 중 AgentCore 컨테이너를 자동으로 빌드함
  TriggerImageBuild:
    Type: Custom::CodeBuildTrigger
    DependsOn:
      - ECRRepository # ECR 리포지토리가 먼저 존재하는지 확인
      - AgentImageBuildProject # CodeBuild 프로젝트가 준비되었는지 확인
      - CodeBuildTriggerFunction # Lambda 함수가 배포되었는지 확인
    Properties:
      ServiceToken: !GetAtt CodeBuildTriggerFunction.Arn
      ProjectName: !Ref AgentImageBuildProject
      WaitForCompletion: "true" # 계속하기 전에 빌드 완료 대기

  # ========================================================================
  # VPC 모듈 - 네트워크 인프라
  # ========================================================================
  # 프라이빗 서브넷 및 AWS 서비스 통신용 VPC 엔드포인트를 갖춘 안전한
  # AgentCore VPC 환경을 생성합니다. 보안 강화를 위해 모든 AgentCore
  # 트래픽이 AWS 네트워크 내부에 유지됩니다.
  # ========================================================================

 
  ClientVPC:
    Type: AWS::EC2::VPC
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: >-
              Demo/tutorial VPC does not require flow logs; enable VPC Flow Logs in production
    Properties:
      CidrBlock: "10.1.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: vpc-client
  
  # AgentCore 애플리케이션을 호스팅할 프라이빗 서브넷
  ClientPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ClientVPC
      CidrBlock: "10.1.1.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet-1"
        - Key: Type
          Value: Private

  # AgentCore Runtime용 보안 그룹 - 에이전트 인스턴스의 네트워크 액세스 제어
  AgentCoreRuntimeSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for AgentCore Runtime - allows outbound HTTPS to VPC endpoints only"
      VpcId: !Ref ClientVPC
      # 초기 송신 규칙 없음
      Tags:
        - Key: Name
          Value: agentcore-runtime-sg

  # VPC 엔드포인트용 보안 그룹 - VPC 엔드포인트를 통한 AWS 서비스 액세스 제어
  VPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for VPC endpoints - allows HTTPS from AgentCore runtime"
      VpcId: !Ref ClientVPC
      SecurityGroupEgress:
      - IpProtocol: "-1"
        CidrIp: "127.0.0.1/32"
        Description: "Explicit deny-all egress rule for VPC endpoints (no outbound needed)"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc-endpoint-sg"


  # ========================================================================
  # VPC 엔드포인트 - 안전한 AWS 서비스 액세스
  # ========================================================================
  # VPC 엔드포인트를 사용하면 AgentCore가 인터넷을 통해 트래픽을 라우팅하지 않고
  # AWS 서비스에 안전하게 접근할 수 있습니다. 각 엔드포인트에는 적절한
  # 보안 그룹과 정책이 구성됩니다.
  # ========================================================================

  # AgentCore 서비스용 VPC 엔드포인트 - VPC 내부에서 AgentCore API 액세스 지원
  AgentCoreVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ClientVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agentcore"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref ClientPrivateSubnet1
      SecurityGroupIds:
        - !Ref VPCEndpointSG
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-agentcore-endpoint"

  # ECR API용 VPC 엔드포인트 - 컨테이너 레지스트리 API 액세스 지원
  ECRAPIVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ClientVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref ClientPrivateSubnet1
      SecurityGroupIds:
        - !Ref VPCEndpointSG
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ecr-api-endpoint"


  # ECR Docker Registry용 VPC 엔드포인트 - 컨테이너 이미지 다운로드 지원
  ECRDKRVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ClientVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref ClientPrivateSubnet1
      SecurityGroupIds:
        - !Ref VPCEndpointSG
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ecr-dkr-endpoint"


  # CloudWatch Logs용 VPC 엔드포인트 - AgentCore Runtime 로깅 지원
  CloudLogVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ClientVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref ClientPrivateSubnet1
      SecurityGroupIds:
        - !Ref VPCEndpointSG
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cloudwatch-logs-endpoint"


  # Bedrock Runtime용 VPC 엔드포인트 - LLM 모델 추론 지원
  BedrockRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ClientVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref ClientPrivateSubnet1
      SecurityGroupIds:
        - !Ref VPCEndpointSG
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bedrock-runtime-endpoint"


  # ========================================================================
  # 보안 그룹 규칙 - 네트워크 액세스 제어
  # ========================================================================

  # AgentCore Runtime에서 HTTPS를 통해 VPC 엔드포인트와 통신하도록 허용
  AgentCoreRuntimeEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AgentCoreRuntimeSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSG
      Description: "Allow outbound HTTPS from AgentCore Runtime to VPC endpoints"

  # VPC 엔드포인트가 AgentCore Runtime의 HTTPS 트래픽을 수신하도록 허용
  VPCEndpointIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VPCEndpointSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AgentCoreRuntimeSG
      Description: "Allow inbound HTTPS from AgentCore runtime to VPC endpoints"

  # ========================================================================
  # EC2 테스트 모듈 - 개발 및 테스트 인프라
  # ========================================================================
  # VPC 내부에서 AgentCore를 테스트할 퍼블릭 서브넷과 EC2 인스턴스를 생성합니다.
  # 클라이언트 애플리케이션에서 AgentCore API를 호출하는 방법을 보여 줍니다.
  # ========================================================================

  # 퍼블릭 서브넷 - 인터넷 액세스가 가능한 개발용 EC2 인스턴스 호스팅
  ClientPublicSubnet1:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: >-
              Public subnet requires MapPublicIpOnLaunch for tutorial accessibility; disable in production
    Properties:
      VpcId: !Ref ClientVPC
      CidrBlock: "10.1.100.0/28" # 테스트 인스턴스용 소규모 서브넷(IP 16개)
      AvailabilityZone: !Select [0, !GetAZs ""] # 첫 번째 AZ 사용
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-1"
        - Key: Type
          Value: Public

  # Internet Gateway - 퍼블릭 서브넷에 인터넷 액세스 제공
  ClientInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  # VPC에 Internet Gateway 연결
  ClientInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ClientVPC
      InternetGatewayId: !Ref ClientInternetGateway

  # 퍼블릭 서브넷용 라우팅 테이블 - 퍼블릭 트래픽의 라우팅 규칙 정의
  ClientPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ClientVPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  # 기본 경로 - 모든 인터넷 트래픽을 Internet Gateway로 전달
  ClientPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: ClientInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref ClientPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ClientInternetGateway

  # 퍼블릭 서브넷을 라우팅 테이블과 연결
  ClientPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ClientPublicSubnet1
      RouteTableId: !Ref ClientPublicRouteTable

  # 개발용 EC2 인스턴스의 IAM 역할
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AWS::Region}-ec2-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EC2InstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: "*"
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-${AWS::Region}-ec2-instance-role"
        - Key: StackName
          Value: !Ref AWS::StackName

  # 인스턴스 프로필 - IAM 역할을 EC2 인스턴스에 연결
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-${AWS::Region}-ec2-instance-profile"
      Roles:
        - !Ref EC2InstanceRole

  # 개발용 EC2 인스턴스의 보안 그룹
  EC2InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W2
            reason: >-
              Demo EC2 instance allows SSH from 0.0.0.0/0 for tutorial access; restrict to specific IPs in production
          - id: W5
            reason: >-
              Demo EC2 instance allows SSH ingress from internet for tutorial access; restrict in production
          - id: W9
            reason: >-
              SSH CIDR not restricted to /32 for tutorial accessibility; restrict to specific IP in production
    Properties:
      GroupDescription: "Security group for development EC2 instance - allows SSH and outbound HTTPS"
      VpcId: !Ref ClientVPC
      SecurityGroupIngress:
        # SSH 액세스 - 개발 및 문제 해결용
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # 참고: 프로덕션에서는 특정 IP 범위로 제한
          Description: "Allow SSH access for development and troubleshooting"
      SecurityGroupEgress:
        # VPC 엔드포인트 액세스 - AWS 서비스 통신용
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref VPCEndpointSG
          Description: "Allow outbound HTTPS to VPC endpoints from EC2 Instance"
        # AgentCore Runtime 액세스 - 에이전트 호출 테스트용
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref AgentCoreRuntimeSG
          Description: "Allow outbound HTTPS to AgentCore Runtime from EC2 Instance"
        # 인터넷 액세스 - 패키지 다운로드 및 업데이트용
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Allow HTTPS outbound to internet"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Allow HTTP outbound to internet"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ec2-instance-sg"
        - Key: Purpose
          Value: "Development Instance Security"

  # 추가 보안 그룹 규칙 - EC2의 VPC 엔드포인트 액세스 허용
  VPCEndpointIngressFromEC2Rule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VPCEndpointSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EC2InstanceSecurityGroup
      Description: "Allow inbound HTTPS from EC2 Instance to VPC endpoints"

  # 개발용 EC2 인스턴스 - AgentCore 통합 테스트용
  DevelopmentInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}" # 최신 Amazon Linux 2023 ARM64
      InstanceType: "t4g.small" # 비용 효율적인 ARM64 인스턴스 타입
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref EC2InstanceSecurityGroup
      SubnetId: !Ref ClientPublicSubnet1
      KeyName: !Ref "AWS::NoValue" # SSH 키 없이 SSM Session Manager 사용
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-dev-instance"


  # ========================================================================
  # AgentCore 모듈 - Runtime 및 도구
  # ========================================================================

  # AgentCore Runtime - 에이전트의 기본 실행 환경
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn:
      - TriggerImageBuild # 컨테이너 이미지가 먼저 빌드되었는지 확인
      - BrowserTool # Browser 도구를 사용할 수 있는지 확인
    Properties:
      AgentRuntimeName: !Sub
        - "${StackNameUnderscore}_runtime"
        - StackNameUnderscore: !Join ["_", !Split ["-", !Ref "AWS::StackName"]]
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub "${ECRRepository.RepositoryUri}:${ImageTag}" # 빌드된 컨테이너 이미지 사용
      RoleArn: !GetAtt AgentExecutionRole.Arn
      NetworkConfiguration:
        NetworkMode: "VPC" # 보안 격리를 위해 VPC에 배포
        NetworkModeConfig:
          Subnets:
            - !Ref ClientPrivateSubnet1 # 인터넷 액세스가 없는 프라이빗 서브넷
          SecurityGroups:
            - !Ref AgentCoreRuntimeSG # 제한된 보안 그룹
      Description: !Sub "AgentCore runtime with browser automation for ${AWS::StackName}"
      EnvironmentVariables:
        BROWSER_ID: !GetAtt BrowserTool.BrowserId # Browser 도구에 연결
        AWS_REGION: !Sub "${AWS::Region}" # 서비스 호출용 AWS 리전

  # Browser 도구 - 웹 자동화 기능 제공
  BrowserTool:
    Type: AWS::BedrockAgentCore::BrowserCustom
    Properties:
      Name: !Sub
        - "${StackNameUnderscore}_browser"
        - StackNameUnderscore: !Join ["_", !Split ["-", !Ref "AWS::StackName"]]
      Description: !Sub "Browser tool for ${AWS::StackName} - enables web automation and scraping"
      NetworkConfiguration:
        NetworkMode: "PUBLIC" # 웹 탐색을 위해 Browser에 인터넷 액세스 필요
      RecordingConfig:
        Enabled: false # 개인 정보 보호 및 성능을 위해 세션 녹화 비활성화

# ============================================================================
# 출력 섹션 - 모듈별 구성
# ============================================================================
Outputs:
  # AgentCore 모듈 출력
  AgentRuntimeId:
    Description: "Unique identifier of the created AgentCore runtime"
    Value: !GetAtt AgentRuntime.AgentRuntimeId
    Export:
      Name: !Sub "${AWS::StackName}-AgentRuntimeId"
  
  AgentRuntimeArn:
    Description: "Unique identifier of the created AgentCore runtime"
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
    Export:
      Name: !Sub "${AWS::StackName}-AgentRuntimeArn"

  BrowserId:
    Description: "Unique identifier of the browser tool for web automation"
    Value: !GetAtt BrowserTool.BrowserId
    Export:
      Name: !Sub "${AWS::StackName}-BrowserId"

  # VPC 모듈 출력
  VPCId:
    Description: "ID of the created VPC for network reference"
    Value: !Ref ClientVPC
    Export:
      Name: !Sub "${AWS::StackName}-VPCId"

  # 개발 모듈 출력
  DevelopmentInstanceId:
    Description: "Instance ID of the development EC2 instance for testing"
    Value: !Ref DevelopmentInstance
    Export:
      Name: !Sub "${AWS::StackName}-DevelopmentInstanceId"

  # 모니터링 및 문제 해결
  CloudWatchLogGroup:
    Description: "CloudWatch log group for AgentCore runtime logs"
    Value: !Sub "/aws/bedrock-agentcore/runtimes/${AgentRuntime.AgentRuntimeId}"
    Export:
      Name: !Sub "${AWS::StackName}-LogGroup"
