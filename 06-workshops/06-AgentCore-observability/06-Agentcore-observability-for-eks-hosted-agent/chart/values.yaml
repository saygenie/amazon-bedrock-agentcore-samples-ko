# strands-agents-travel의 기본값
# YAML 형식의 파일입니다.

replicaCount: 1

image:
  repository: placeholder
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # service account 생성 여부 지정
  create: true
  # service account에 추가할 annotation
  annotations: {}
  # 사용할 service account 이름
  # 설정하지 않고 create가 true이면 fullname template으로 이름 생성
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  pathType: Prefix
  hosts: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []
  #  - maxSkew: 1
  #    minDomains: 3
  #    topologyKey: topology.kubernetes.io/zone
  #    whenUnsatisfiable: DoNotSchedule
  #    labelSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: strands-agents-travel
  #  - maxSkew: 1
  #    topologyKey: kubernetes.io/hostname
  #    whenUnsatisfiable: ScheduleAnyway
  #    labelSelector:
  #      matchLabels:
  #        app.kubernetes.io/instance: strands-agents-travel

podDisruptionBudget:
  enabled: false
  # maxUnavailable과 minAvailable 중 하나만 지정 가능
  # minAvailable: 1    # Can be an absolute number or a percentage (e.g., "50%")
  # maxUnavailable: 1  # Can be an absolute number or a percentage (e.g., "50%")

env: []
  # - name: ENV_VAR_NAME
  #   value: "value"
